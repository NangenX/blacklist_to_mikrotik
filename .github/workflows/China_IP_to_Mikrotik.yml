name: China_IP

on:
  schedule:
    - cron: '0 */6 * * *' # 每6个小时运行
  workflow_dispatch:

jobs:
  update-china-ip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download China IP list
      run: |
        curl -fsSL -o china.txt https://gaoyifan.github.io/china-operator-ip/china.txt
        sed '/^#/d' china.txt > china_no_comments.txt

    - name: Convert to Mikrotik format
      run: |
        echo "/ip firewall address-list" > CN-IP.rsc
        awk '{ sub(/\r$/, ""); if (NF) print "add list=CN-IP address=" $1 " comment=\"CN-IP\"" }' china_no_comments.txt >> CN-IP.rsc

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: CN-IP-Latest
        name: China IP Update
        files: |
          CN-IP.rsc
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 6
