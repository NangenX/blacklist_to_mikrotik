name: Sichuan_IP

on:
  schedule:
    - cron: '0 0 1 * *' # 每月1日 00:00 UTC（北京时间 08:00）运行
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

jobs:
  update-blacklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Download Sichuan IP list
      run: |
        curl -o sichuan.txt https://metowolf.github.io/iplist/data/cncity/510000.txt
        sed '/^#/d' sichuan.txt > sichuan_no_comments.txt
        
    - name: Stamp build time
      run: echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

    - name: Convert blacklist to Mikrotik format
      run: |
        {
          echo "# Sichuan IP | updated: $BUILD_TIME"
          echo "/ip firewall address-list"
        } > Sichuan.rsc
        awk '{ sub(/\r$/, ""); if (NF) print "add list=Sichuan address=" $1 " comment=\"Sichuan\"" }' sichuan_no_comments.txt >> Sichuan.rsc
        echo "ENTRIES=$(grep -c '^add ' Sichuan.rsc || echo 0)" >> "$GITHUB_ENV"
        
    - name: Refresh release timestamp
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete "Sichuan-IP-Latest" --yes --cleanup-tag=false || true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Sichuan-IP-Latest
        name: Sichuan IP Update
        body: |
          自动构建（UTC）：${{ env.BUILD_TIME }}
          数据源：Sichuan IP，条目数：${{ env.ENTRIES }}
        files: |
          Sichuan.rsc
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 6


